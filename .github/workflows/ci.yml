name: Build and test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Revit 2027 add-in and dimension fixture
        run: |
          dotnet build plugin/RevitMCPPlugin.csproj -c "Release R27"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build commandset/RevitMCPCommandSet.csproj -c "Release R27"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/dimensions/DimensionSmoke.csproj -c Release
          exit $LASTEXITCODE
      - name: Build and test MCP server
        working-directory: server
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --omit=dev
          exit $LASTEXITCODE
