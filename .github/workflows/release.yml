name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and verify Revit 2027 distribution
        shell: pwsh
        run: |
          $version = (Get-Content server/package.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref_type }}" -eq 'tag' -and "${{ github.ref_name }}" -ne "v$version") { throw 'Tag/package version mismatch' }
          ./scripts/Build-Package.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: RevitMCP27-Windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Revit MCP 27 — ${{ github.ref_name }}
          body_path: docs/RELEASE-v1.1.0.md
          fail_on_unmatched_files: true
          files: |
            artifacts/*.zip
            artifacts/*.sha256
            docs/START-PL.md
